<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주파수 탐색 | Radio DX</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index.html">RADIO DX</a><nav aria-label="전체 메뉴"><a href="index.html">국내 라디오</a><a href="overseas.html">해외 라디오</a><a href="shortwave.html">주요 단파방송</a><a href="tuner.html" aria-current="page">주파수 탐색</a></nav></header>
<main><h1>주파수로 방송 찾기</h1><p class="intro">수신한 주파수를 입력하거나 다이얼을 움직여 가까운 방송을 찾아보세요. 현재 수집한 국내·해외 주파수 데이터를 함께 검색합니다.</p>
<section class="tuner-panel" aria-label="주파수 설정"><fieldset id="bands"><legend>수신 대역</legend><label><input type="radio" name="band" value="AM" checked> AM · MW 중파</label><label><input type="radio" name="band" value="SW"> SW 단파</label><label><input type="radio" name="band" value="FM"> FM 초단파</label></fieldset>
<div class="frequency-group" role="group" aria-label="주파수"><div class="tuner-controls"><label for="frequency">주파수 <span id="unit">kHz</span><input id="frequency" type="number" inputmode="decimal" aria-describedby="frequency-help"></label></div><p id="frequency-help" class="note"></p><label class="slider-label" for="dial">주파수 슬라이더</label><input id="dial" type="range"><div class="dial-endpoints"><span id="minimum"></span><output id="readout" for="frequency dial"></output><span id="maximum"></span></div><p id="input-error" role="status"></p></div><div class="tuner-controls"><label for="scope">방송 범위<select id="scope"><option value="all">국내 + 해외</option><option value="domestic">국내</option><option value="overseas">해외</option></select></label><label for="window">검색 폭<select id="window"><option value="near">가까운 범위</option><option value="wide">넓은 범위</option><option value="all">대역 전체</option></select></label></div>
</section>
<section aria-labelledby="result-heading"><h2 id="result-heading">가까운 방송</h2><p id="summary" role="status" aria-live="polite"></p><div id="results" class="frequency-results"></div></section>
<noscript>주파수 탐색을 사용하려면 JavaScript를 활성화하세요.</noscript></main><footer>Radio DX · <a href="https://github.com/surajang/radio-dx">GitHub</a></footer><script src="stations.js"></script><script src="tuner.js"></script></body></html>
